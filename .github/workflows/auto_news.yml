name: BoaBoa Auto News

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Restore Blogger Token
        run: |
          echo '${{ secrets.BLOGGER_TOKEN }}' > token.json

      - name: Run Auto News Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID || '8826247154815720532' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add posted_history.json generated_images/
          git commit -m "Update posted history and generated images [skip ci]" || echo "Tidak ada riwayat baru"
          git push
